    - data:
        code: "\ndef main(csv_text: str) -> dict:\n\n    import csv\n    from io import\
          \ StringIO\n\n    # Assuming csv_text is a long string with the full CSV\
          \ content\n    # Don't split it — let csv.reader handle it\n\n    f = StringIO(csv_text[0].strip())\n\
          \n    # Skip header + separator lines\n    _ = f.readline()\n    _ = f.readline()\n\
          \n    reader = csv.reader(f, delimiter='|')\n    data_array = []\n\n   \
          \ for row in reader:\n        # Skip invalid/empty rows\n        if len(row)\
          \ < 3:\n            continue\n\n        # row[0] is empty (pipe before description)\n\
          \        # row[-1] is empty (pipe after readme)\n        # row[1] = description\n\
          \        # row[2:-1] = everything between description and last pipe => full\
          \ readme\n        description = row[1].strip()\n        readme_parts = row[2:-1]\n\
          \        readme = '|'.join(part.strip() for part in readme_parts)\n\n  \
          \      data_array.append({\n            \"description\": description,\n\
          \            \"readme\": readme\n        })\n\n\n    return {\"result\"\
          : data_array}\n\n\n\n"
        code_language: python3
        desc: ''
        outputs:
          result:
            children: null
            type: array[object]
